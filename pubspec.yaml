name: idroriparto
description: Ripartizione consumi e spese dell'acqua condominiale.
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  intl: any
  shared_preferences: ^2.5.3
  pdf: ^3.11.3
  printing: ^5.14.2
  dynamic_color: ^1.7.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/brand/logo_source.png
    - assets/fonts/NotoSans-Regular.ttf
    - assets/fonts/NotoSans-SemiBold.ttf
  fonts:
    - family: Outfit
      fonts:
        - asset: assets/fonts/Outfit.ttf
    - family: Fraunces
      fonts:
        - asset: assets/fonts/Fraunces.ttf
